# Monta o instalador do Archiva e publica uma versão no GitHub.
#
# Para lançar uma versão nova: mude o arquivo VERSION (ex.: 0.8.1), acrescente a seção no NOVIDADES.md
# e envie para a branch main. Se ainda não existir a versão v0.8.1 em Releases, o GitHub monta o
# Archiva-Setup-0.8.1.exe, cria a tag e publica; o Archiva instalado avisa sozinho.
#
# "Run workflow" (manual) monta o instalador; publica só se a versão ainda não existir.

name: Publicar versão

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/publicar.yml, empacotamento/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir versão
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "versao=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "publicar=nao" >> $env:GITHUB_OUTPUT; Write-Host "v$v já publicada." }
          else { "publicar=sim" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Montar Archiva.exe
        run: |
          python empacotamento\versao.py
          pyinstaller empacotamento\archiva.spec --noconfirm --clean

      - name: Testar se abre
        shell: pwsh
        run: |
          $p = Start-Process dist\Archiva\Archiva.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "O Archiva.exe fechou sozinho (código $($p.ExitCode))."; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Montar instalador
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.versao }} empacotamento\archiva.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Guardar instalador (teste)
        if: steps.ver.outputs.publicar != 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: Archiva-Setup-${{ steps.ver.outputs.versao }}
          path: saida/*.exe

      - name: Notas da versão
        if: steps.ver.outputs.publicar == 'sim'
        shell: pwsh
        run: |
          python empacotamento\notas.py ${{ steps.ver.outputs.versao }} > notas.txt

      - name: Publicar no GitHub
        if: steps.ver.outputs.publicar == 'sim'
        uses: softprops/action-gh-release@v2
        with:
          name: Archiva ${{ steps.ver.outputs.versao }}
          tag_name: v${{ steps.ver.outputs.versao }}
          target_commitish: ${{ github.sha }}
          body_path: notas.txt
          files: saida/Archiva-Setup-${{ steps.ver.outputs.versao }}.exe
